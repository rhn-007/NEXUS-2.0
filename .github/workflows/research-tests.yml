name: NEXUS research tests

on:
  push:
    branches:
      - feature/integrated-research-system
  pull_request:
    branches:
      - main

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline research tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
