name: NEXUS research tests

on:
  push:
    branches:
      - feature/integrated-research-system
  pull_request:
    branches:
      - main

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Only what the code imports directly. The audio and speech
        # packages (faster-whisper, sounddevice, pynput, openwakeword) are
        # not needed because the tests stand in for them.
        run: python -m pip install requests python-dotenv beautifulsoup4 numpy playwright
      - name: Run offline research tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
